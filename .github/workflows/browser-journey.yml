name: Staging browser journey
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Shipment reference to verify on the hosted site
        required: true
        type: choice
        options:
          - MV-4821
          - MV-6158
        default: MV-4821
permissions:
  contents: read
jobs:
  verify-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npm run check:browser
        env:
          CHECK_REFERENCE: ${{ inputs.reference }}
          SITE_URL: https://hexrift.github.io/meridian-vale-platform/?ref=${{ inputs.reference }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-browser-evidence
          path: browser-check/
